<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<title>Sync Gate: mobile states</title>
	<link rel="stylesheet" href="../../styles.css">
	<link rel="stylesheet" href="demo.css">
	<style>
		body {
			display: flex;
			justify-content: center;
			gap: 46px;
			width: 1200px;
			height: 900px;
			padding: 40px 20px 0;
		}

		figure {
			display: flex;
			flex-direction: column;
			align-items: center;
			margin: 0;
		}

		figcaption {
			margin-top: 22px;
			text-align: center;
			font-size: 18px;
			font-weight: 600;
			color: var(--text-normal);
		}

		figcaption span {
			display: block;
			margin-top: 4px;
			font-size: 14px;
			font-weight: 400;
			color: var(--text-muted);
		}
	</style>
</head>
<body>
	<!-- Lucide icons (ISC License), inlined so the page renders without network access. -->
	<svg width="0" height="0" style="position: absolute">
		<symbol id="i-lock" viewBox="0 0 24 24"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></symbol>
		<symbol id="i-check-circle-2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/></symbol>
		<symbol id="i-wifi-off" viewBox="0 0 24 24"><path d="M12 20h.01"/><path d="M8.5 16.429a5 5 0 0 1 7 0"/><path d="M5 12.859a10 10 0 0 1 5.17-2.69"/><path d="M19 12.859a10 10 0 0 0-2.007-1.523"/><path d="M2 8.82a15 15 0 0 1 4.177-2.643"/><path d="M22 8.82a15 15 0 0 0-11.288-3.764"/><path d="m2 2 20 20"/></symbol>
		<symbol id="i-refresh-cw" viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></symbol>
		<symbol id="i-bookmark" viewBox="0 0 24 24"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></symbol>
		<symbol id="i-book-open" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>
		<symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></symbol>
		<symbol id="i-more-horizontal" viewBox="0 0 24 24"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></symbol>
		<symbol id="i-panel-left" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M9 3v18"/></symbol>
		<symbol id="i-arrow-left" viewBox="0 0 24 24"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></symbol>
		<symbol id="i-arrow-right" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></symbol>
		<symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
		<symbol id="i-menu" viewBox="0 0 24 24"><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="18" y2="18"/></symbol>
	</svg>

	<!-- 1. Editing open: muted check mark. -->
	<figure>
		<div class="phone">
			<div class="phone-status"><span>9:41</span><span class="pill"></span><span class="battery"><span></span></span></div>
			<div class="mobile-header">
				<svg class="icon"><use href="#i-panel-left"/></svg>
				<div class="title">Shopping list</div>
				<div class="mobile-actions">
					<span class="clickable-icon sync-gate-header-action sync-gate-tone-muted" aria-label="Sync Gate: editing open"><svg class="icon"><use href="#i-check-circle-2"/></svg></span>
					<span class="clickable-icon"><svg class="icon"><use href="#i-bookmark"/></svg></span>
					<span class="clickable-icon"><svg class="icon"><use href="#i-book-open"/></svg></span>
					<span class="clickable-icon"><svg class="icon"><use href="#i-more-horizontal"/></svg></span>
				</div>
			</div>
			<div class="view-content">
				<div class="note">
					<h1>Shopping list</h1>
					<h2>Groceries</h2>
					<ul>
						<li>Oat milk</li>
						<li>Bananas</li>
						<li>Rice</li>
						<li>Tomatoes</li>
					</ul>
					<h2>Home</h2>
					<ul>
						<li>Light bulbs</li>
						<li>Dish soap<span class="caret"></span></li>
					</ul>
				</div>
			</div>
			<div class="navbar">
				<svg class="icon"><use href="#i-arrow-left"/></svg>
				<svg class="icon"><use href="#i-arrow-right"/></svg>
				<svg class="icon"><use href="#i-plus"/></svg>
				<span class="tabs">2</span>
				<svg class="icon"><use href="#i-menu"/></svg>
			</div>
		</div>
		<figcaption>Editing open<span>Muted check mark</span></figcaption>
	</figure>

	<!-- 2. Locked: accent lock icon, Reading view, lock card. -->
	<figure>
		<div class="phone">
			<div class="phone-status"><span>9:41</span><span class="pill"></span><span class="battery"><span></span></span></div>
			<div class="mobile-header">
				<svg class="icon"><use href="#i-panel-left"/></svg>
				<div class="title">Shopping list</div>
				<div class="mobile-actions">
					<span class="clickable-icon sync-gate-header-action sync-gate-tone-accent" aria-label="Sync Gate: waiting for Sync"><svg class="icon"><use href="#i-lock"/></svg></span>
					<span class="clickable-icon"><svg class="icon"><use href="#i-bookmark"/></svg></span>
					<span class="clickable-icon"><svg class="icon"><use href="#i-pencil"/></svg></span>
					<span class="clickable-icon"><svg class="icon"><use href="#i-more-horizontal"/></svg></span>
				</div>
			</div>
			<div class="view-content sync-gate-host">
				<div class="note">
					<h1>Shopping list</h1>
					<h2>Groceries</h2>
					<ul>
						<li>Oat milk</li>
						<li>Bananas</li>
						<li>Rice</li>
						<li>Tomatoes</li>
					</ul>
					<h2>Home</h2>
					<ul>
						<li>Light bulbs</li>
						<li>Dish soap</li>
					</ul>
				</div>
				<div class="sync-gate-overlay">
					<div class="sync-gate-card" role="status">
						<div class="sync-gate-card-icon"><svg><use href="#i-refresh-cw"/></svg></div>
						<div class="sync-gate-card-title">Waiting for Sync</div>
						<div class="sync-gate-card-text">Getting changes from your other devices. Editing opens when Sync finishes.</div>
						<button>Edit anyway</button>
					</div>
				</div>
			</div>
			<div class="navbar">
				<svg class="icon"><use href="#i-arrow-left"/></svg>
				<svg class="icon"><use href="#i-arrow-right"/></svg>
				<svg class="icon"><use href="#i-plus"/></svg>
				<span class="tabs">2</span>
				<svg class="icon"><use href="#i-menu"/></svg>
			</div>
		</div>
		<figcaption>Locked<span>Accent lock icon and lock card</span></figcaption>
	</figure>

	<!-- 3. Offline: warning wifi-off icon and banner, editing open. -->
	<figure>
		<div class="phone">
			<div class="phone-status"><span>9:41</span><span class="pill"></span><span class="battery"><span></span></span></div>
			<div class="mobile-header">
				<svg class="icon"><use href="#i-panel-left"/></svg>
				<div class="title">Shopping list</div>
				<div class="mobile-actions">
					<span class="clickable-icon sync-gate-header-action sync-gate-tone-warning" aria-label="Sync Gate: offline, editing is open"><svg class="icon"><use href="#i-wifi-off"/></svg></span>
					<span class="clickable-icon"><svg class="icon"><use href="#i-bookmark"/></svg></span>
					<span class="clickable-icon"><svg class="icon"><use href="#i-book-open"/></svg></span>
					<span class="clickable-icon"><svg class="icon"><use href="#i-more-horizontal"/></svg></span>
				</div>
			</div>
			<div class="view-content sync-gate-host sync-gate-has-banner">
				<div class="sync-gate-banner" role="status">
					<span class="sync-gate-banner-icon"><svg><use href="#i-wifi-off"/></svg></span>
					<span class="sync-gate-banner-text">You are offline. You can edit. Sync sends your changes when the connection returns.</span>
				</div>
				<div class="note">
					<h1>Shopping list</h1>
					<h2>Groceries</h2>
					<ul>
						<li>Oat milk</li>
						<li>Bananas</li>
						<li>Rice</li>
						<li>Tomatoes</li>
					</ul>
					<h2>Home</h2>
					<ul>
						<li>Light bulbs</li>
						<li>Dish soap</li>
						<li>Batteries<span class="caret"></span></li>
					</ul>
				</div>
			</div>
			<div class="navbar">
				<svg class="icon"><use href="#i-arrow-left"/></svg>
				<svg class="icon"><use href="#i-arrow-right"/></svg>
				<svg class="icon"><use href="#i-plus"/></svg>
				<span class="tabs">2</span>
				<svg class="icon"><use href="#i-menu"/></svg>
			</div>
		</div>
		<figcaption>Offline<span>Warning icon and offline banner</span></figcaption>
	</figure>
</body>
</html>
