name: Bug report
description: Report a problem with Sync Gate.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Do not paste private note content. For a security problem, use the security policy instead.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Describe the problem. Include the text of any banner or notice.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
      description: Describe what you expected Sync Gate to do.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open the app on the phone.
        2. Edit a note on the laptop.
        3. ...
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Sync Gate version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Settings → General → Current version.
      placeholder: 1.9.0
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      multiple: true
      options:
        - Windows
        - macOS
        - Linux
        - iOS / iPadOS
        - Android
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Debug log
      description: Turn on "Debug logging" in the plugin settings, reproduce the problem and paste the "[sync-gate]" lines from the developer console. Remove file names that you do not want to share.
      render: text
